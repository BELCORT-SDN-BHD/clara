packages:
  - packages/*
  - "!packages/backup"
  - "!packages/reporting-render"
  - apps/*
# NOTE: spike/ is intentionally NOT a workspace member. It is the frozen
# Slice-0 runtime spike (its own lockfile + node_modules) and must not be
# pulled into the monorepo install graph. See docs/ARCHITECTURE.md
# Appendix A and spike/README.md.
#
# NOTE: packages/backup (the clara-backup off-site DR app, Wave A2 §8 / WA2-R6)
# is DELIBERATELY EXCLUDED from the workspace (the `!packages/backup` negation).
# It is a self-contained, separately-imaged batch app deployed as its own Fly app
# — never installed into @clara/runtime and never part of the monorepo install
# graph. Excluding it keeps `pnpm install --frozen-lockfile` (CI) green without
# regenerating pnpm-lock.yaml: a new workspace importer with no lockfile entry
# would otherwise fail the frozen install. Its own deps are installed INSIDE its
# Docker image from packages/backup/package.json. Mirrors the spike rationale.
#
# NOTE: packages/reporting-render (the clara-render deterministic report worker,
# Wave E lane ζ / design part2 §10) is EXCLUDED for exactly the same two reasons,
# and the second one is load-bearing rather than tidy: adding a workspace importer
# with no pnpm-lock.yaml entry fails `pnpm install --frozen-lockfile`, which is
# every CI job's first step. It is a separately-imaged batch app deployed as its
# own Fly app, never installed into @clara/runtime, and its deps are installed
# INSIDE its Docker image from packages/reporting-render/package.json. Its own
# lint and unit battery are run by CI as explicit steps (`.github/workflows/ci.yml`),
# not through `pnpm -r`, precisely because `-r` cannot see a non-member.
