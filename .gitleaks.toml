# gitleaks config for CI (finding 4) — the MAINTAINED second-layer secret scan.
#
# scripts/check-leaks.mjs is the fast, dependency-free first line; this is the
# authoritative second layer the docs (ADR-012) reference. The allowlist below
# narrowly suppresses KNOWN non-secret high-entropy strings so the gate stays
# meaningful instead of flaky — real credentials are still caught.
title = "clara gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Non-secret high-entropy strings + placeholder/evidence files"
# Paths are regexes matched against the (repo-relative) file path.
paths = [
  '''pnpm-lock\.yaml''',            # dependency integrity (sha512) hashes — not secrets
  '''frozen-workflows\.json''',     # freeze-lint golden sha256 manifest — not secrets
  '''skills-lock\.json''',          # vendored-skills provenance sha256 manifest — not secrets
  '''(^|/)[^/]*\.example$''',       # *.env.example etc. — placeholders only
  '''(^|/)docs/audit/''',           # frozen audit evidence: long file-path/quote strings
]
regexes = [
  '''world:world@localhost''',      # WDK dev-default fixed string (also exempt in check-leaks.mjs)
]
