# gitleaks config for CI (finding 4) — the MAINTAINED second-layer secret scan.
#
# scripts/check-leaks.mjs is the fast, dependency-free first line; this is the
# authoritative second layer the docs (ADR-012) reference. The allowlist below
# narrowly suppresses KNOWN non-secret high-entropy strings so the gate stays
# meaningful instead of flaky — real credentials are still caught.
title = "clara gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Non-secret high-entropy strings + placeholder/evidence files"
# Paths are regexes matched against the (repo-relative) file path.
paths = [
  '''pnpm-lock\.yaml''',            # dependency integrity (sha512) hashes — not secrets
  '''frozen-workflows\.json''',     # freeze-lint golden sha256 manifest — not secrets
  '''skills-lock\.json''',          # vendored-skills provenance sha256 manifest — not secrets
  '''(^|/)[^/]*\.example$''',       # *.env.example etc. — placeholders only
  '''(^|/)docs/audit/''',           # frozen audit evidence: long file-path/quote strings
  # GATE-3 eval evidence: carries RPR's client UUID (a tenant identifier, NOT a
  # credential) which trips generic-api-key on entropy alone. Scoped to these two
  # archived files by name — path-based, not fingerprint-based, because a squash
  # merge rewrites the commit sha every fingerprint is pinned to (bit twice).
  '''(^|/)docs/plan/research/slice6/gate3-eval-(report\.md|results\.json)$''',
]
regexes = [
  '''world:world@localhost''',      # WDK dev-default fixed string (also exempt in check-leaks.mjs)
  # ROME SECRETARY's client UUID, pinned by 0062_rs_name_only_guard.sql's arming
  # statement (provenance in that file's header). A tenant identifier, NOT a
  # credential — the same class as the RPR uuid path exemption above, but anchored
  # to the exact captured value because it lives in a migration, not an archived
  # doc. (Allowlist regexes match the CAPTURED SECRET, not the line.)
  '''^e054b797-2641-413c-809f-f27603bbe9c7$''',
  # A delta acceptance-battery account-set KEY (a per-test grouping label, not a
  # credential); "bound512" + "eval" trips generic-api-key on entropy alone.
  '''^bound512_eval$''',
]
