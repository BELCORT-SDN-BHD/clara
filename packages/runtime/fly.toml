# fly.toml — Clara runtime (Slice 4, contract §5 / §4.1). Deploy from the REPO ROOT
# so the Docker build context is the pnpm workspace root:
#     fly deploy --config packages/runtime/fly.toml
#
# The app name below is a PLACEHOLDER — the operator creates the real app
# (`fly apps create <name>`) and replaces this line before the first deploy.
app = "clara-runtime"

# Singapore — closest region to Malaysia (ADR-014).
primary_region = "sin"

[build]
  # Dockerfile path resolves relative to THIS config file (fly behavior, proven
  # at first deploy); the BUILD CONTEXT is the directory `fly deploy` runs from —
  # deploy from the REPO ROOT so the Dockerfile's root-relative COPYs work.
  dockerfile = "Dockerfile"

[env]
  PORT = "3200"
  # The deployed app IS the durable runtime — the world is ON here (and ONLY here).
  CLARA_START_WORLD = "1"
  WORKFLOW_TARGET_WORLD = "@workflow/world-postgres"
  CLARA_SPOOL_DIR = "/data/spool"
  CLARA_SPOOL_QUOTA_MB = "512"
  CLARA_SPOOL_TTL_MIN = "60"
  CLARA_DOC_EGRESS_APPROVED = "0"
  CLARA_CLAMD_MANAGED = "1"
  CLARA_CLAMD_SOCKET = "/run/clamav/clamd.ctl"
  # Secrets (OPENAI_API_KEY, SUPABASE_JWT_*, WORKFLOW_POSTGRES_URL,
  # CLARA_RUNTIME_DATABASE_URL, CLARA_READ_DATABASE_URL) are set with `fly secrets
  # set` — NEVER in this file. See the deploy runbook in README.md.

# ONE always-on machine — EXPLICITLY NON-HA (contract §4.1). The durable engine is
# single-leader (the 'router' advisory lock); a second machine would contend it and
# split the loops. Do NOT scale this app > 1. The world must never be parked by the
# platform, so auto start/stop are OFF and one machine is always running.
[http_service]
  internal_port = 3200
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  # Readiness gate (§4.7): /ready FAILS on DB unreachable / world dead / control
  # listener dead / taxonomy HALT, or the second consecutive storage-write failure —
  # the LB then holds traffic (and a crash-only exit takes the machine down for Fly to restart).
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/ready"

# Liveness — the process is up (no dependencies). Distinct from /ready.
[[http_service.checks]]
  interval = "30s"
  timeout = "3s"
  grace_period = "10s"
  method = "get"
  path = "/health"

[[restart]]
  # After a crash-loop burns Fly's default 10-restart budget the machine stays
  # STOPPED (ceremony lesson 2026-07-19) — always-restart keeps the single
  # non-HA machine self-healing.
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  # 1gb OOM-killed clamd once the full ClamAV signature set loaded (live
  # incident 2026-07-19); 2gb is the proven-stable floor for clamd + node.
  memory = "2gb"

# Disposable encrypted intake spool only; canonical custody remains private
# object Storage. Create this single-region volume with snapshots disabled before
# deploy (README runbook). Never scale the app or attach a second machine.
[mounts]
  source = "clara_spool"
  destination = "/data"
