# Clara runtime. Deploy from the repository root for the workspace build context:
#     fly deploy --config packages/runtime/fly.toml
app = "clara-runtime"

# Singapore deployment region.
primary_region = "sin"

[build]
  # Dockerfile is relative to this config; build context is the repository root.
  dockerfile = "Dockerfile"

[env]
  PORT = "3200"
  # Start the durable world on this runtime host; keep it off in restore drills.
  CLARA_START_WORLD = "1"
  WORKFLOW_TARGET_WORLD = "@workflow/world-postgres"
  CLARA_SPOOL_DIR = "/data/spool"
  CLARA_SPOOL_QUOTA_MB = "512"
  CLARA_SPOOL_TTL_MIN = "60"
  CLARA_DOC_EGRESS_APPROVED = "0"
  CLARA_CLAMD_MANAGED = "1"
  CLARA_CLAMD_SOCKET = "/run/clamav/clamd.ctl"
  # Secrets (OPENAI_API_KEY, SUPABASE_JWT_*, WORKFLOW_POSTGRES_URL,
  # CLARA_RUNTIME_DATABASE_URL, CLARA_READ_DATABASE_URL) are set with `fly secrets
  # set` — NEVER in this file. See the deploy runbook in README.md.

# One always-on machine with a local spool. Multiple-machine operation is not
# supported by this deployment; keep auto start/stop off so background work continues.
[http_service]
  internal_port = 3200
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  # /ready checks critical dependencies; optional lane warnings are not hard gates.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/ready"

# Liveness — the process is up (no dependencies). Distinct from /ready.
[[http_service.checks]]
  interval = "30s"
  timeout = "3s"
  grace_period = "10s"
  method = "get"
  path = "/health"

[[restart]]
  # Keep restarting after crashes; availability still depends on this one machine.
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  # ClamAV's full signature set plus Node exceeded the former 1 GB allocation.
  memory = "2gb"

# Disposable encrypted intake spool only; canonical custody remains private
# object Storage. Create this single-region volume with snapshots disabled before
# deploy (README runbook). Never scale the app or attach a second machine.
[mounts]
  source = "clara_spool"
  destination = "/data"
