# Off-site backup app, separate from the durable runtime.
# Build/push without starting a backup; see README.md, "Validate and deploy".
# Create the scheduled Machine from the verified image with explicit environment,
# secret-file mounts and VM settings. fly machine run does not replay this file's
# app deployment configuration.
app = "clara-backup"

# Singapore, near the source database.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# Batch job with no HTTP service. Backup freshness is monitored through
# the configured dead-man switch rather than an inbound health endpoint.

# Sizing reference; pass equivalent VM settings when creating the Machine.
# Staging uses /tmp by default. For a large daily delta, mount a volume and
# change CLARA_BACKUP_STAGING_DIR; verify available space before running.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# Configure scheduling on the Machine and inspect its actual state after creation.
# Daily scheduling is approximate; choose the monitoring grace accordingly.
# Verify the first completed run and its freshness manifest, not just the schedule.
