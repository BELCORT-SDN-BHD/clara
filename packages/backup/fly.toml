# fly.toml — clara-backup (Wave A2 §8 / WA2-R6): the off-site DR backup app.
#
# A SEPARATE Fly app from clara-runtime (the runtime machine is explicitly NON-HA and
# must never carry this job). Deploy from the REPO ROOT so the build context carries
# packages/backup AND packages/db:
#     fly deploy --config packages/backup/fly.toml
#
# The app name below is a PLACEHOLDER — the owner creates the real app
# (`fly apps create clara-backup`) before the first deploy.
app = "clara-backup"

# Singapore — same city as the Supabase project (ap-southeast-1); low pooler latency,
# free egress to R2 (WA2-R6).
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# NO [http_service] and NO [[services]]: this is a BATCH job, not a server. It has no
# port and serves no traffic — it boots, runs the pipeline to completion, and exits.
# Liveness is the dead-man's-switch (healthchecks.io), NOT an HTTP health check.

[env]
  # Non-secret defaults. Every SECRET is set with `fly secrets set` on THIS app only:
  #   DATABASE_URL           (session pooler, port 5432 — reads all schemas + auth PII)
  #   CLARA_BACKUP_STORAGE_URL, CLARA_BACKUP_STORAGE_KEY_FILE + the service_role key file
  #   RCLONE_CONFIG (+ the R2 token inside it) — or RCLONE_CONFIG_R2_* env
  #   CLARA_BACKUP_PING_URL  (the healthchecks.io ping URL)
  # The age RECIPIENT (public) key ships in the image (deploy/age-recipient.txt) — it is
  # not a secret. See docs/ops/DR.md §9 for the exact `fly secrets set` list.
  CLARA_BACKUP_R2_REMOTE = "r2"
  CLARA_BACKUP_STORAGE_BUCKET = "firm-docs"
  CLARA_BACKUP_AGE_RECIPIENTS_FILE = "/app/packages/backup/deploy/age-recipient.txt"
  CLARA_BACKUP_RETENTION_DAYS = "30"

# Modest one-shot sizing — the job is I/O-bound (dump + upload), not compute-heavy.
# The ~52 MB dump + only the NEW encrypted firm-docs stage in /tmp (rootfs); mount a
# volume at /data and repoint CLARA_BACKUP_STAGING_DIR only if the daily delta is large.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# SCHEDULING (set at machine-create time, not in this file — Fly has no fly.toml
# `schedule` key). After `fly deploy` builds the image + app, create ONE scheduled
# machine that boots daily and exits:
#     fly machine run . --config packages/backup/fly.toml --schedule daily \
#         --region sin --app clara-backup
# Fly's schedule granularity is coarse (hourly|daily|weekly|monthly); `daily` + the
# 26h dead-man's-switch grace (docs/ops/DR.md §7) tolerates the coarse run time.
# Do NOT set min_machines_running — a scheduled machine is created stopped and Fly
# starts it on the schedule, then it exits.
