# Sealed report renderer: separate app from the durable runtime.
# Build and push without starting a job; see README.md, "Configuration and deployment".
# Create/configure the Machine with explicit environment, secrets and VM settings.
# Do not assume fly machine run applies this file's app deployment configuration.
app = "clara-render"

# Singapore, near the database; each job uses a short-lived database session.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# Batch worker: no HTTP listener. It drains claimable sealed jobs, then exits.

# Sizing reference. Pass equivalent VM settings when creating the Machine.
# The worker processes one render at a time.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# The runtime's reconciler-render.mjs starts the configured Machine when work is due.
# Configure a coarse fallback schedule on the Machine and verify its actual settings;
# scheduling and health monitoring are operational configuration, not declared here.
