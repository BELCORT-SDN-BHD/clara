name: CI

# The anti-"misleading-green" gate. The OLD build's CI tested a decommissioned
# schema (defect GAP1-5) — a green check that proved nothing. This pipeline applies
# the REAL migrations, builds the REAL packages, and runs the smoke + DR round-trip
# against a THROWAWAY postgres:17 — NEVER a live project (ARCHITECTURE §9, README).
#
# THE CI DIET (2026-08-11, owner-ruled after the quota exhaustion): PRs run on the
# pull_request event only; push runs only on main; a docs-only diff (the `changes`
# classifier, FAIL-CLOSED) skips the code/DB legs; lint runs unconditionally. A SKIP
# is a POSITIVE statement — the job's entire input surface is untouched by the diff —
# and the weekly scheduled full sweep re-proves every gate regardless.
#
# THE CI ECONOMICS OVERHAUL (2026-08-21, owner-ruled — ADR-0073, the record). Three
# structural changes, ZERO gate-content changes (step bodies moved verbatim into
# .github/actions/* composites — lever 5, restoring the 500-line harness limit):
#   1. CLOSED-WAVE DRILLS DEMOTE TO THE WEEKLY SWEEP (lever 1): the 8 closed-wave
#      upgrade drills + 4 Wave-E contract drills + the D-b frontier matrix run on
#      schedule/workflow_dispatch ONLY; the ruled per-PR backstop stays (estate suite
#      + deploy-onto-existing, plus lint, build, e2es + DR, render drill). A CURRENT-
#      wave drill rides per-PR and demotes at wave close. Residual: a closed-drill
#      regression surfaces at the next sweep — after a PR touching a closed drill or
#      this pipeline, run the sweep by hand: `gh workflow run ci.yml`.
#   2. THE MONOLITH SPLITS into parallel jobs (lever 2): build · db-estate ·
#      db-live-gates · render-drill run in parallel (2-wide across the WSL fleet then;
#      fully parallel on hosted runners since 裁-135 — one fresh VM per job).
#   3. THE REQUIRED CHECK `ci` BECOMES A FAIL-CLOSED META-GATE (terminal job below),
#      closing two pre-existing fail-open shapes: lint was never a required check,
#      and a failed classifier's skip satisfied protection.
#
# THE HOSTED-RUNNER MIGRATION (2026-09-02, owner-ruled — 裁-135, superseding the
# 裁-134 self-hosted concurrency cap). Every job moves from the four self-hosted WSL2
# runner instances to GitHub-hosted `ubuntu-latest` (Ubuntu 24.04). ZERO gate-content
# changes: the same nine jobs, the same fail-closed `ci` meta-gate, the same docs-only
# classifier, the same sweep-only cadence, the same step bodies. What changed is the
# HOST and the three things that were only ever self-hosted hardening:
#   a. `runs-on` — `[self-hosted, linux, clara]` -> `ubuntu-latest` on all TEN job
#      definitions (the nine gates plus this file's own meta-gate). The four runners
#      stay REGISTERED but no event routes to them any more; the owner decommissions
#      them by `docs/ops/ci-runner.md`'s own procedure.
#   b. HOST-WIDE `flock` SERIALISATION IS GONE (the pg17 client and the drill font):
#      a hosted runner is a single-tenant, single-job, throwaway VM, so there is no
#      second job on the host to race. The IDEMPOTENCE GUARD in each install is KEPT
#      — it is what makes the step safe to re-read, not the lock.
#   c. `timeout-minutes` ON EVERY JOB — a BACKSTOP against a hung leg, not a target.
#      Self-hosted minutes were free and a hung leg only blocked a runner; hosted
#      minutes are billed, and GitHub's own default is SIX HOURS. Sized against the
#      last full code run of main on the WSL fleet (run 33592223941: changes 18s ·
#      lint 1m49s · build 1m27s · render-drill 30s · db-live-gates 9m45s ·
#      db-estate 22m24s) and then widened for CORE COUNT: that host had 24 vCPUs,
#      while a standard hosted runner has 2 (private repo) or 4 (public). The
#      parallel-heavy legs — `node --test` fans out to CPU count — are therefore
#      expected to run several times longer, so a ceiling that merely doubled the
#      WSL timing would false-red honest work. Every value here is deliberately
#      loose; a leg that APPROACHES its ceiling is the signal to investigate.
# ONE MEASURED LOSS, named rather than discovered later: the shared Docker daemon's
# BuildKit cache does not survive between runs, so the render drill rebuilds its image
# cold (19s here against 8s warm on the fleet). The pnpm store was called a second loss
# in an earlier draft and is NOT one — setup-workspace's `cache: pnpm` is warm across
# jobs ("Cache hit … Cache restored successfully" in lint and build, run 33631065480);
# what moved is where the store lives, not whether it is populated.
# CONCURRENCY: no slot cap — a hosted runner has no fleet to contend for; see below.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full sweep (Thu 03:23 MYT): every job runs — the ADR-0073-demoted
    # closed-wave drills included — even through docs-only weeks.
    - cron: "23 19 * * 3"
  workflow_dispatch:

concurrency:
  # ONE AXIS, TWO REGIMES (裁-135 re-cut; no slot cap — hosted runners have no fleet
  # contention, which is exactly what makes the 裁-134 cap moot).
  #
  #   pull_request  -> a PER-BRANCH group keyed on github.ref (refs/pull/<n>/merge is
  #                    stable across that PR's pushes and distinct from every other
  #                    PR's), WITH cancel-in-progress: a superseded push's run is dead
  #                    weight and, on billed minutes, dead spend.
  #   everything else (push to main · workflow_dispatch · schedule)
  #                 -> a RUN-ID-KEYED group, so each run is alone in its own group and
  #                    cancellation is a structural no-op. This is the property the old
  #                    shape only half had: 'weekly-sweep' was one shared literal, so a
  #                    second sweep cancelled the first, and every push to main shared
  #                    ci-refs/heads/main, so a merge landing while an earlier merge's
  #                    CI was still running cancelled it — the opposite of "a scheduled
  #                    run is never cancelled" and of "main's CI always completes".
  #
  # cancel-in-progress is ALSO gated on the event: it is read from the newly-queued run,
  # so belt (the expression) and braces (the unique group) both point the same way.
  #
  # THE COST OF "MAIN IS NEVER CANCELLED", PRICED RATHER THAN DISCOVERED (#513 review, F3).
  # Removing main from the cancelling group removes the only bound there was on concurrent
  # main pipelines: N merges landing inside one CI duration now produce N complete,
  # uncancelled, concurrently-running pipelines. That is INTENDED. Hosted runners have no
  # fleet to contend for, so those N runs are genuinely parallel rather than queued; on a
  # public repository they are also free of charge. The reason to keep them is not the
  # price, though — it is that each merge's run verifies a DIFFERENT tree, and per-commit
  # granularity is exactly what lets a bisect say WHICH merge broke main. Cancelling the
  # older run buys a few minutes and throws that away. 裁-134's "pushes to main are never
  # cancelled" clause was ruled against a zero-spend fleet; it is RE-RULED here on a metered
  # one, on the bisect argument.
  #
  # `queue` (GitHub's documented concurrency option: `single` — the default — cancels and
  # REPLACES an older pending run when a newer one arrives; `max` lets up to 100 pend).
  # `queue: max` with `cancel-in-progress: true` is a documented workflow VALIDATION ERROR,
  # which is why this is an expression and not a constant — the PR arm must stay `single`.
  #
  # READ THIS BEFORE YOU RELY ON IT. `max` is DECORATIVE in the shape above: every non-PR
  # group is keyed on github.run_id, so it is a group of ONE and there is never a pending run
  # to displace. And the value is set by an EXPRESSION, which the docs do NOT document as
  # supported for this key — what the runs prove is that GitHub PARSES the expression and
  # DISPATCHES the jobs (33630834296, 33631065480), NOT that `max` is honoured. It cannot be
  # proven here, because nothing in this shape gives it anything to do.
  # So the tripwire is deliberately conditional: if you ever give a non-PR event a SHARED
  # group key, `queue: max` becomes the only thing standing between a pending run and silent
  # replacement — and at that moment you must PROVE it is honoured (queue two runs into the
  # shared group and confirm the older one still runs) rather than trusting this line. A
  # protection whose first real use is its first test is not a protection.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  # =========================================================================
  # THE DIFF CLASSIFIER — plain git, no third-party action, FAIL-CLOSED. Outputs
  # default to true and are narrowed ONLY when the diff is confidently computed and
  # every changed path is provably outside a job's input surface. schedule /
  # workflow_dispatch / a zero-SHA push / any git failure => everything runs.
  #   code=false  ONLY when every changed file is in ADR-0069 ruling 2's ENUMERATED
  #               docs-only set, matched LITERALLY: docs/**, AGENTS.md, CLAUDE.md,
  #               PROGRESS.md. Nothing else — markdown outside the set is not
  #               automatically low-risk (a package README can document a deploy step);
  #               better an occasional README-only PR takes the full ladder than a
  #               code-adjacent doc slips through single-lane. `.claude/**` is matched
  #               FIRST and forced to CODE (a rules file changes how agents behave on
  #               CODE work). Arm order is load-bearing — shell `case` takes the FIRST
  #               match, and `*` matches `/`, so `.claude/*` covers the subtree.
  #               (Owner call, 2026-08-12; recorded on ADR-0069 ruling 2.)
  #   db=true     when anything under packages/db/**, this workflow file, the
  #               .github/actions/** composites (step bodies live there now — 5-lens
  #               review fix), or a root manifest/lockfile changed — the per-PR
  #               partition gate's input surface. Sweep-only DB legs no longer read
  #               this output; on schedule/dispatch everything defaults true anyway.
  # $GITHUB_* values are read as shell env, never spliced via ${{ }}; EV_BEFORE is a SHA.
  # =========================================================================
  changes:
    # GitHub-hosted (owner-ruled 2026-09-02, 裁-135; docs/ops/ci-runner.md "Hosted from
    # 2026-09-02"): a fresh single-tenant ubuntu-24.04 VM per job. The four self-hosted
    # WSL runners stay registered but no event routes to them.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.classify.outputs.code }}
      db: ${{ steps.classify.outputs.db }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # DIAGNOSTIC ONLY — no gate reads it, nothing branches on it. It exists so the
      # hosted fleet's real shape (cores, memory, free disk, docker, the image's own
      # psql) is a MEASUREMENT in every run's log rather than a claim in a PR body.
      # GitHub's docs quote 4-core/16 GB for public repos and 2-core/8 GB for private;
      # this prints what the runner actually gave us.
      - name: Runner facts (diagnostic — nothing gates on this)
        run: |
          echo "runner:  $RUNNER_OS $RUNNER_ARCH  image=${ImageOS:-?} ${ImageVersion:-?}"
          echo "cores:   $(nproc)"
          free -h || true
          df -h / /home/runner /mnt 2>/dev/null || true
          docker --version || echo "docker: ABSENT"
          psql --version || echo "psql: ABSENT"
          node --version
      - id: classify
        env:
          EV_BEFORE: ${{ github.event.before }}
        run: |
          CODE=true; DB=true
          RANGE=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"; then
              BASE="$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF" 2>/dev/null || true)"
              [ -n "$BASE" ] && RANGE="$BASE..HEAD"
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            case "$EV_BEFORE" in
              ""|0000000000000000000000000000000000000000) : ;;  # first/forced push — stay fail-closed
              *) git cat-file -e "$EV_BEFORE" 2>/dev/null && RANGE="$EV_BEFORE..HEAD" ;;
            esac
          fi
          if [ -n "$RANGE" ]; then
            if FILES="$(git diff --name-only $RANGE)" && [ -n "$FILES" ]; then
              CODE=false; DB=false
              while IFS= read -r f; do
                case "$f" in
                  .claude/*) CODE=true ;;
                  docs/*|AGENTS.md|CLAUDE.md|PROGRESS.md) : ;;
                  *) CODE=true ;;
                esac
                case "$f" in
                  packages/db/*|.github/workflows/ci.yml|.github/actions/*|pnpm-lock.yaml|package.json|pnpm-workspace.yaml|.npmrc) DB=true ;;
                esac
              done <<< "$FILES"
            fi
          fi
          echo "--- event=$GITHUB_EVENT_NAME range=${RANGE:-<none: fail-closed>} => code=$CODE db=$DB ---"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "db=$DB" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # LINT + SECRETS + BOUNDARY GATES — EVERY event unconditionally, docs-only included
  # (a docs commit can leak a credential or violate the wiki boundary exactly as code
  # can). Bodies verbatim in the lint-suite composite; via the `ci` meta-gate a red
  # here now BLOCKS merge — which the old required-check wiring never enforced.
  # =========================================================================
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: freeze-lint compares against origin/main; push/scheduled
          # gitleaks scans full history.
          fetch-depth: 0
      - uses: ./.github/actions/fetch-base-main
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/lint-suite

  # =========================================================================
  # THE DOUBLE-RENDER BYTE-EQUALITY GATE (Wave E lane ζ; design part2 §9/§10).
  # docs/ops/DR-render.md states every PR performs this drill — so the pipeline does,
  # per-PR, NOT demoted (ADR-0073): a claimed-but-unrun gate is read as evidence. All
  # FOUR arms asserted by the script (match · match under changed SOURCE_DATE_EPOCH ·
  # changed pinned input must DIFFER · the product's own assemble() preamble). Its own
  # job because it builds an image; fail-closed classifier polarity (!= 'false'); the
  # shared daemon's BuildKit cache persists across runs (lever 3 — no plumbing needed).
  # =========================================================================
  render-drill:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.5
      # THE RENDERER'S OWN UNIT BATTERY, WIRED IN (Wave F Track-A, F-A5b card 1).
      #
      # It was running NOWHERE. packages/reporting-render is deliberately excluded from the pnpm
      # workspace (pnpm-workspace.yaml:4), so the estate suite's `pnpm -r --if-present test` never
      # reached it; the root `render:check` script that would have run it is invoked by no workflow;
      # and this job built the image and ran the double-render drill without ever executing
      # tests/. So layout.mjs's own battery — the assembler that decides what a statutory PDF says —
      # has been green-by-absence. A test that never runs is not a test, and card 1 adds the
      # substitution seam's render-time refusals to that same directory, so it is wired here rather
      # than added to a directory nothing executes.
      #
      # `node --test` DIRECTLY, not pnpm: this job installs no workspace (it needs none — the whole
      # battery is Node built-ins plus first-party modules, measured, and `pg` is imported only by
      # db.mjs/render-worker.mjs which the battery does not load). It runs BEFORE the image build so
      # a broken assembler fails in seconds instead of after a Docker build.
      - name: Renderer unit battery (packages/reporting-render/tests)
        run: node --test packages/reporting-render/tests/
      # The fixture is typeset with a content-addressed font MOUNTED at run time, exactly
      # as production supplies them — the image ships no font directory, so a drill that
      # found one would not test what ships.
      #
      # DEFENCE, NOT A MEASURED REQUIREMENT — and the correction matters more than the
      # step. An earlier draft of this comment claimed the install was REQUIRED because
      # the runner image "ships NO DejaVu", citing the image's own Ubuntu2404-Readme apt
      # manifest. That manifest is a CURATED subset, so reading it answered a question it
      # cannot answer: `fonts-dejavu-core` arrives TRANSITIVELY and is present. Measured on
      # image 20260823.283.1, hosted runs 33622887117 and 33631065480: this step emits no
      # apt output and takes 0-1 s, i.e. the `dpkg -s` guard short-circuits and nothing is
      # installed. Absence from the wrong instrument is not absence (house law 2).
      # The step STAYS: the image can stop shipping it transitively at any refresh, and
      # double-render-drill.mjs FAILS rather than skips with no DejaVuSans.ttf, so a cheap
      # guard is the right shape — it is just not doing anything today.
      # The host-wide flock retired with the self-hosted fleet (裁-135) — one job owns
      # this VM, so nothing races the dpkg lock. The IDEMPOTENCE GUARD is kept: it is
      # what makes a re-run cheap, and it is the half that was never about the lock.
      - name: Ensure a drill font is present
        run: |
          sudo bash -ec '
            if dpkg -s fonts-dejavu-core >/dev/null 2>&1; then exit 0; fi
            apt-get update -o DPkg::Lock::Timeout=180
            apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=180 fonts-dejavu-core'
      # RUN-SCOPED image tag, KEPT (Codex review 2026-08-21, HIGH). Its original reason —
      # the four runner instances shared ONE Docker daemon, so a fixed tag let a concurrent
      # run RETAG between this run's build and its drill — retired with the fleet, but the
      # tag stays: it costs nothing, it keeps the drill's --image argument honest about
      # WHICH build it graded, and it survives any future move back to a shared daemon.
      # MEASURED LOSS (裁-135): the shared daemon's BuildKit cache did NOT come along —
      # each hosted run builds this image cold. Env vars, never ${{ }} splicing.
      - name: Build the renderer image (pinned engine + pinned extractor)
        run: docker build -f packages/reporting-render/Dockerfile -t "clara-render:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" .
      - name: Double-render drill — determinism, the control arm, and the real preamble
        run: node packages/reporting-render/scripts/double-render-drill.mjs --image "clara-render:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Remove the run-scoped image tag
        if: always()
        run: docker rmi -f "clara-render:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true

  # =========================================================================
  # BUILD LEG (ADR-0073 lever 2 — split from the former monolith): typecheck, the real
  # build, and the post-build worker-path gate. No DB service — the monolith always ran
  # these against an EMPTY clara_ci, so nothing here ever read a schema.
  # =========================================================================
  build:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # apps/web's build runs `scripts/check-public-key.mjs` BEFORE bundling: it
      # refuses any value in the public key slot that is not a publishable/anon
      # key, ABSENCE included (security review 2026-08-27, finding 7 — a name
      # proves nothing about a value, and `next build` inlines whatever sits
      # there into every browser bundle). CI is a compile check, not a deploy,
      # so it supplies a fabricated PUBLISHABLE-class placeholder: the gate stays
      # strict in both arms instead of being taught to pass on an empty slot.
      # These are not credentials — no Supabase project answers to them.
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_ci_placeholder"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - name: Typecheck (tsc across TS packages)
        run: pnpm typecheck
      - name: Build (nitro runtime + next dashboard)
        run: pnpm build
      # MUST run after Build: the image-layout half reads .output/server/index.mjs. The
      # structured/XML lane was dead in every deployed image because nitro inlines the
      # worker-spawning modules and the sibling URL then resolves beside the bundle, where
      # nothing is copied (Gate S, 2026-07-28). Typecheck/lint/tests all read the SOURCE
      # layout — the one layout that worked — so only a post-build check can see this.
      - name: Worker-path gate (spawn sites + built-image layout)
        run: node scripts/check-worker-paths.mjs
      # MUST run after Build, for the same reason the worker-path gate does — and it is the ONLY
      # lane that can make this claim at all. The estate suite deliberately runs unbuilt, so a
      # bundle assertion living only in a test cell SKIPPED in every job and certified nothing
      # (P6-1 Codex review, MEDIUM-1; law 28 — absence is not evidence). A missing bundle is a
      # FAILURE inside this script, never a skip. It reads the pinned version out of registry.ts
      # rather than hardcoding one, so it needs no edit at the next _vN.
      - name: Workflow-bundle gate (registry pins + WDK directives reached the served artifact)
        run: node scripts/check-workflow-bundle.mjs
      # Commit parity is meaningful only after the served workflow bundle has been certified:
      # the runtime's object-literal census must not outrun the web reader in this same commit.
      - name: Parts parity (web reader covers runtime-emittable kinds)
        run: node packages/runtime/scripts/check-parts-parity.mjs

  # =========================================================================
  # DB ESTATE LEG (ADR-0073 lever 2): the two per-PR backstops the owner's ruling
  # names — deploy-onto-existing + the full estate suite — against a throwaway
  # postgres:17 (never the frozen project). Also where a CURRENT wave's drill rides
  # per-PR while its wave is open (none today: Wave F is proven per-PR by these two
  # legs; F-A2 PR-1 ships the next drill).
  # =========================================================================
  db-estate:
    needs: changes
    # FAIL-CLOSED AT THIS LAYER TOO (review R1 MAJOR): != 'false', never == 'true' --
    # an absent/garbled output must RUN the job, not skip it green.
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clara_ci
        ports:
          # EPHEMERAL host port, KEPT. Its original reason (a FIXED host port collides
          # when two jobs share one Docker host) retired with the self-hosted fleet, but
          # this job declares only one service here while db-live-gates declares FOUR on
          # one VM — ephemeral mapping is what lets four postgres:17 containers coexist
          # without hand-assigned ports. Steps read the mapped port via wire-ports.
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # libpq vars — the db scripts read these (no DSN in code/argv). PGPORT is wired
      # per-run by the wire-ports step (job.services is not a job-env context).
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: clara_ci
      # clara_ci is the ephemeral service DB (matches the guard's *_ci pattern) —
      # authorize the destructive DR/reset scripts against it ONLY. lib/guard.mjs
      # still refuses any non-ephemeral target even with this set.
      CLARA_ALLOW_DESTRUCTIVE: "1"
    steps:
      - name: Wire service ports (ephemeral host ports -> env)
        run: |
          echo "PGPORT=${{ job.services.postgres.ports['5432'] }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so deploy-onto-existing + migration-history compare against
          # origin/main (append-only-vs-base is the ONLY real protection).
          fetch-depth: 0
      - uses: ./.github/actions/fetch-base-main
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/pg17-client
      - uses: ./.github/actions/db-estate-suite

  # =========================================================================
  # LIVE-BEHAVIOR GATES (ADR-0073 lever 2): the runtime e2es + the DR pair, per-PR —
  # NOT demoted: they exercise LIVE code paths the current wave keeps changing, and the
  # DR round-trip is law-39 standing material (ADR-012/0020). `postgres_b` is a SECOND,
  # INDEPENDENT cluster used only by the DR round-trip so cluster-role recovery is
  # genuinely cross-cluster (Codex HIGH-5: one cluster's shared pg_authid makes role
  # parity a tautology).
  # =========================================================================
  db-live-gates:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clara_ci
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres_b:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # 2026-09-02 CI-shape ruling: TWO MORE pristine clusters, one per full-fresh-migrate
      # invocation this job makes (never reused across steps). postgres/5432 above stays
      # intake_ci-only. WHY: roles are Postgres CLUSTER-global while schema_migrations is
      # per-DATABASE. 0154's own tail assertion (immutable, merged) pins an ABSOLUTE clara
      # role count at its position in the chain; it cannot tell a role minted by ITS OWN
      # cluster's later migrations (fine -- 0154 always runs before any higher-numbered
      # file, migrate.mjs sorts strictly ascending) apart from a role that ALREADY EXISTS
      # because a DIFFERENT database's earlier, completed full chain on the SAME cluster
      # left it behind. Giving every full-fresh-migrate invocation its own cluster matches
      # 0154's stated assumption everywhere and needs ZERO maintenance when the next
      # role-minting migration lands (measured: PR #493's C-3 mints clara_auth_wall/_login
      # on top of this PR's pair) -- the rejected alternative was a hardcoded role-name
      # reset, which reds again at the next mint. postgres_b stays drci_target-ONLY (DR
      # round-trip target, genuinely empty pg_authid until roles-bootstrap+restore run
      # there -- an existing invariant); do not add a fourth full-migrate consumer onto it.
      postgres_c:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres_d:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: clara_ci
      CLARA_ALLOW_DESTRUCTIVE: "1"
    steps:
      - name: Wire service ports (ephemeral host ports -> env)
        run: |
          echo "PGPORT=${{ job.services.postgres.ports['5432'] }}" >> "$GITHUB_ENV"
          echo "PGB_PORT=${{ job.services.postgres_b.ports['5432'] }}" >> "$GITHUB_ENV"
          echo "PGC_PORT=${{ job.services.postgres_c.ports['5432'] }}" >> "$GITHUB_ENV"
          echo "PGD_PORT=${{ job.services.postgres_d.ports['5432'] }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/pg17-client
      - uses: ./.github/actions/db-live-gates

  # =========================================================================
  # CLOSED-WAVE DRILLS — WEEKLY SWEEP + MANUAL DISPATCH ONLY (ADR-0073 lever 1): the
  # eight closed-wave upgrade drills (C9 · Slice-5 · Slice-6 · WB-0020 · x37 · x40 ·
  # x41 · the D-b split frontier-on-disk drill) and the four Wave-E contract drills
  # (δ · θ · ε · η). Content unchanged, cadence weekly; the `ci` meta-gate asserts this
  # job is SKIPPED on pull_request/push and SUCCESS on the sweep — either drift fails.
  # =========================================================================
  closed-wave-drills:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clara_ci
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: clara_ci
      CLARA_ALLOW_DESTRUCTIVE: "1"
    steps:
      - name: Wire service ports (ephemeral host ports -> env)
        run: |
          echo "PGPORT=${{ job.services.postgres.ports['5432'] }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/pg17-client
      - uses: ./.github/actions/closed-wave-upgrade-drills
      - uses: ./.github/actions/wave-e-contract-drills

  # ===========================================================================
  # [WAVE D-b SPLIT] PER-SLICE FRONTIER MATRIX — WEEKLY SWEEP + MANUAL DISPATCH ONLY
  # (ADR-0073 lever 1: a closed wave's four frontier legs, the same growing cost). The
  # leg logic — presence gate, NONE-OR-ALL, name-not-number, E17, cell floors, the
  # contracts roster, the isolated drill — is unchanged in .github/actions/frontier-leg.
  # Each matrix leg gets its OWN hosted runner VM and its OWN ephemeral postgres:17.
  # ===========================================================================
  db-slice-frontiers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # `migname` is the slice's STABLE migration suffix — the identity that survives a
          # merge-time renumber. The frontier number and the drill filename are derived from it.
          - slice: d-b0
            dbtag: b0
            migname: wave_d_b0_shared_authorities
          - slice: d-b1
            dbtag: b1
            migname: wave_d_b1_staff_advances
          - slice: d-b3
            dbtag: b3
            migname: wave_d_b3_af2_composite
          - slice: d-b2
            dbtag: b2
            migname: wave_d_b2_recurring_adjustments
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clara_ci
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: clara_ci
      CLARA_ALLOW_DESTRUCTIVE: "1"
    steps:
      - name: Wire service ports (ephemeral host ports -> env)
        run: |
          echo "PGPORT=${{ job.services.postgres.ports['5432'] }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/frontier-leg
        with:
          slice: ${{ matrix.slice }}
          dbtag: ${{ matrix.dbtag }}
          migname: ${{ matrix.migname }}

  # ===========================================================================
  # [WAVE D-b SPLIT] THE PARTITION IS TOTAL — standing, DATABASE-FREE. STAYS PER-PR
  # (ADR-0073): it costs seconds and catches the PR-authoring mistake (a file joining
  # the x41/x42 corpus and no list) at the PR; the frontier legs it feeds run at the sweep.
  # ===========================================================================
  db-split-partition-total:
    needs: changes
    if: needs.changes.outputs.db != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/partition-total

  # ===========================================================================
  # THE REQUIRED-CHECK META-GATE. Branch protection requires exactly one context —
  # `ci` — and this job IS it now. `if: always()`, then every leg must be success or
  # LAWFULLY skipped: changes + lint success unconditionally; code-/db-gated legs
  # success whenever their classifier output != 'false' (fail-closed polarity),
  # skipped-or-success only on a classified docs-only/non-db diff; sweep-only legs
  # success on schedule/workflow_dispatch and skipped on pull_request/push — drift in
  # EITHER direction fails. A cancelled leg fails the gate. The needs contexts and
  # $GITHUB_EVENT_NAME are read as env, never spliced — the house anti-injection
  # discipline.
  # ===========================================================================
  ci:
    needs:
      - changes
      - lint
      - render-drill
      - build
      - db-estate
      - db-live-gates
      - closed-wave-drills
      - db-slice-frontiers
      - db-split-partition-total
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate — every leg green or lawfully skipped
        env:
          R_CHANGES: ${{ needs.changes.result }}
          R_LINT: ${{ needs.lint.result }}
          R_RENDER: ${{ needs['render-drill'].result }}
          R_BUILD: ${{ needs.build.result }}
          R_ESTATE: ${{ needs['db-estate'].result }}
          R_LIVE: ${{ needs['db-live-gates'].result }}
          R_DRILLS: ${{ needs['closed-wave-drills'].result }}
          R_FRONTIERS: ${{ needs['db-slice-frontiers'].result }}
          R_PARTITION: ${{ needs['db-split-partition-total'].result }}
          OUT_CODE: ${{ needs.changes.outputs.code }}
          OUT_DB: ${{ needs.changes.outputs.db }}
        run: |
          fail=0
          say() { echo "::error::$1"; fail=1; }
          # The classifier and lint are unconditional: only success passes. A failed
          # classifier used to skip everything downstream and still satisfy the required
          # check — the exact fail-open shape this gate exists to close.
          [ "$R_CHANGES" = "success" ] || say "changes: expected success, got '$R_CHANGES' — no classifier verdict, nothing downstream is trustworthy"
          [ "$R_LINT" = "success" ] || say "lint: expected success, got '$R_LINT' — lint runs on EVERY event, docs-only included"
          # Code-gated legs: when code != 'false' they MUST have succeeded; on a classified
          # docs-only diff (code == 'false') skipped is the lawful state.
          code_gated() {
            if [ "$OUT_CODE" != "false" ]; then
              [ "$2" = "success" ] || say "$1: must run and pass on a code diff (code='$OUT_CODE'), got '$2'"
            else
              case "$2" in success|skipped) : ;; *) say "$1: got '$2' on a docs-only diff" ;; esac
            fi
          }
          code_gated "build" "$R_BUILD"
          code_gated "db-estate" "$R_ESTATE"
          code_gated "db-live-gates" "$R_LIVE"
          code_gated "render-drill" "$R_RENDER"
          # DB-gated leg, same polarity against the db output.
          if [ "$OUT_DB" != "false" ]; then
            [ "$R_PARTITION" = "success" ] || say "db-split-partition-total: must run and pass (db='$OUT_DB'), got '$R_PARTITION'"
          else
            case "$R_PARTITION" in success|skipped) : ;; *) say "db-split-partition-total: got '$R_PARTITION' on a non-db diff" ;; esac
          fi
          # Sweep-only legs (ADR-0073): both directions asserted, so a silently-dead sweep
          # leg and a drill running per-PR are BOTH visible failures, never quiet drift.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$R_DRILLS" = "success" ] || say "closed-wave-drills: the sweep must run them, got '$R_DRILLS'"
            [ "$R_FRONTIERS" = "success" ] || say "db-slice-frontiers: the sweep must run them, got '$R_FRONTIERS'"
          else
            [ "$R_DRILLS" = "skipped" ] || say "closed-wave-drills: expected skipped on $GITHUB_EVENT_NAME, got '$R_DRILLS' — event wiring drifted"
            [ "$R_FRONTIERS" = "skipped" ] || say "db-slice-frontiers: expected skipped on $GITHUB_EVENT_NAME, got '$R_FRONTIERS' — event wiring drifted"
          fi
          if [ "$fail" != "0" ]; then exit 1; fi
          echo "gate: every leg green or lawfully skipped (event=$GITHUB_EVENT_NAME code=$OUT_CODE db=$OUT_DB)"
