name: Lint + secrets + boundary gates
description: Root lint, reporting-render checks and the pinned gitleaks scan.
runs:
  using: composite
  steps:
    - name: Lint (freeze-lint + leak-scan + eslint code-lint)
      shell: bash -e {0}
      run: pnpm lint

    # reporting-render is not a workspace member, so run the checks `pnpm -r` cannot reach.
    # Its lint script already runs inside root `pnpm lint`.
    - name: Reporting-render syntax and unit checks
      shell: bash -e {0}
      run: |
        pnpm --dir packages/reporting-render run check
        pnpm --dir packages/reporting-render run test

    # PRs scan their commits against main; other events scan all history. First-parent
    # merge diffs include conflict resolutions. A changed ruleset also scans all history.
    # Read runner variables as shell data and cache the binary by its pinned version.
    - name: Gitleaks (maintained secret scan, version-pinned)
      shell: bash -e {0}
      env:
        GITLEAKS_VERSION: "8.18.4"
      run: |
        GL="$HOME/.cache/gitleaks-${GITLEAKS_VERSION}"
        if [ ! -x "$GL" ]; then
          mkdir -p "$HOME/.cache"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o $RUNNER_TEMP/gitleaks.tgz
          tar -xzf $RUNNER_TEMP/gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
          mv "$RUNNER_TEMP/gitleaks" "$GL"
        fi
        "$GL" version
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          if [ "$GITHUB_BASE_REF" != "main" ]; then
            echo "pull_request base ref is '$GITHUB_BASE_REF', not 'main'; refusing to guess a scan scope." >&2
            exit 1
          fi
          if git rev-parse --verify -q origin/main >/dev/null; then
            # An unreadable diff requires the full-history scan.
            CHANGED="$(git diff --name-only origin/main...HEAD)" || CHANGED=".gitleaks.toml"
            if echo "$CHANGED" | grep -qxF ".gitleaks.toml"; then
              # Exercise new rules against history before they reach main.
              echo "PR context: .gitleaks.toml changed in this PR — running the FULL-history scan pre-merge"
              "$GL" detect --source . --config .gitleaks.toml --redact --no-banner -v --exit-code 1 --log-opts "--diff-merges=first-parent --all"
            else
              echo "PR context: scoping gitleaks to this PR's own commits (origin/main..HEAD, first-parent merge diffs included)"
              "$GL" detect --source . --config .gitleaks.toml --redact --no-banner -v --exit-code 1 --log-opts "--diff-merges=first-parent origin/main..HEAD"
            fi
          else
            echo "PR context but origin/main does not exist yet (first introduction) — nothing to scope against; full-history scan"
            "$GL" detect --source . --config .gitleaks.toml --redact --no-banner -v --exit-code 1 --log-opts "--diff-merges=first-parent --all"
          fi
        else
          echo "push context ($GITHUB_REF): full-history scan, unchanged scope, first-parent merge diffs included"
          "$GL" detect --source . --config .gitleaks.toml --redact --no-banner -v --exit-code 1 --log-opts "--diff-merges=first-parent --all"
        fi
