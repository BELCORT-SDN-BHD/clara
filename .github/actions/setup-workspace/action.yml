name: Setup workspace (pnpm + node + install)
description: >-
  Pinned pnpm + node toolchain and a frozen-lockfile install, shared by every job.
  setup-node caches pnpm's reported store path on the hosted runner.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.33.0

    # `cache: pnpm` MUST come after pnpm/action-setup: setup-node resolves the cache
    # directory by running `pnpm store path`, which needs pnpm already on PATH.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20.19.5
        cache: pnpm

    - name: Install
      shell: bash -e {0}
      run: pnpm install --frozen-lockfile
