name: Setup workspace (pnpm + node + install)
description: >-
  Pinned pnpm + node toolchain and a frozen-lockfile install, shared by every job.
  setup-node caches pnpm's reported store path on the hosted runner.
  Node 22.23.2 matches .nvmrc, the root engines range and the runtime image (#616);
  the action pins run on the node24 action runtime, which GitHub-hosted runners
  default to since 2026-06-16 and require after 2026-09-23.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10.33.0

    # `cache: pnpm` MUST come after pnpm/action-setup: setup-node resolves the cache
    # directory by running `pnpm store path`, which needs pnpm already on PATH.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.23.2
        cache: pnpm

    - name: Install
      shell: bash -e {0}
      run: pnpm install --frozen-lockfile
