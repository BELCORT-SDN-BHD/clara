name: Setup workspace (pnpm + node + install)
description: >-
  Pinned pnpm + node toolchain and a frozen-lockfile install, shared by every job.
  HOSTED RE-CUT (裁-135, 2026-09-02): the install now uses actions/setup-node's own
  `cache: pnpm` instead of the persistent local store this action carried for the
  self-hosted fleet. That store ($HOME/.pnpm-store) was the right answer on a
  long-lived WSL host, where GitHub's remote cache service meant a network zip/unzip
  round-trip per job; a GitHub-hosted runner is a THROWAWAY VM, so a local store is
  cold on every job by construction and the remote cache is the only one that can be
  warm at all. The store path setup-node caches is whatever `pnpm store path` reports,
  so the explicit `--store-dir` is REMOVED — an install writing somewhere the cache
  step never reads is a cache that silently does nothing (ADR-0073 lever 3, re-cut).
  The pinned pnpm/action-setup's per-instance `dest` is also removed with the fleet:
  it existed because that action recursively DELETES its default ~/setup-pnpm before
  reinstalling, and two runner instances shared one HOME (the recorded "setup-pnpm
  race"). One job per VM makes that race structurally impossible.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.33.0

    # `cache: pnpm` MUST come after pnpm/action-setup: setup-node resolves the cache
    # directory by running `pnpm store path`, which needs pnpm already on PATH.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20.19.5
        cache: pnpm

    - name: Install
      shell: bash -e {0}
      run: pnpm install --frozen-lockfile
