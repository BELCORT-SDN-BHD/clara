name: Live-behavior gates (runtime e2es + DR round-trip)
description: >-
  Per-PR runtime end-to-end and disaster-recovery checks. Intake and interview
  tests exercise the engine, spool and workflow code; the DR pair verifies backup
  and restore on separate clusters. The runtime build supplies the modules they load.
  Requires: workspace installed, PG17 client present, libpq env pointing at the primary
  postgres:17 service, PGB_PORT/PGC_PORT/PGD_PORT naming three more clusters' ports.
  Every full-fresh-migrate invocation gets its own pristine cluster: postgres for
  intake_ci, postgres_c for Wave-B, postgres_d
  for the DR round-trip's SOURCE, postgres_b reserved for the DR round-trip's TARGET only.
  Roles are Postgres cluster-global; migration 0154 (merged, immutable) pins an absolute
  clara-role count at its position in the chain, which breaks the moment a SECOND
  from-scratch migrate shares a cluster with a first one that already minted a role a
  later migration adds. Separate clusters avoid ordering as a hidden precondition, and a step
  that needs a SECOND pristine database on a cluster whose chain has already completed takes a
  TEMPLATE COPY of the pristine one instead of migrating again (#637's two-build drill, below).
runs:
  using: composite
  steps:
    # The four e2es below import the built
    # server (`../.output/server/index.mjs`), which the monolith used to satisfy with the
    # whole-workspace build it ran anyway. This job builds ONLY @clara/runtime (nitro),
    # keeping the leg self-contained without artifact plumbing from the build job — the
    # full `pnpm build` + worker-path gate still run per-PR in the build job.
    - name: Build the runtime bundle the e2es import (nitro only)
      shell: bash -e {0}
      run: pnpm --filter @clara/runtime build

    # Slice-5 intake transport e2e (§6 gates of record: SSE liveness under parse
    # load, load ceilings, and the full stream→scan→storage→finalizer→WDK-OCR
    # chain) — in its OWN throwaway DB. The WDK world does NOT self-bootstrap
    # (WO-G G1b, proven): the documented idempotent `bootstrap` bin (the SAME one
    # the S4-V3 runbook runs against prod, README §engine-bootstrap) creates the
    # workflow/graphile_worker schemas first. Ephemeral clara_intake_ci only —
    # never the shared project; the URL omits the password (pg falls back to the
    # job-env PGPASSWORD for the throwaway service container).
    - name: Slice-5 intake transport e2e (isolated DB + world bootstrap)
      shell: bash -e {0}
      run: |
        PGDATABASE=postgres psql -v ON_ERROR_STOP=1 -c 'create database clara_intake_ci'
        PGDATABASE=clara_intake_ci pnpm db:migrate
        PGDATABASE=clara_intake_ci pnpm db:seed
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGPORT/clara_intake_ci" \
          pnpm --filter @clara/runtime exec bootstrap
        cd packages/runtime
        PGDATABASE=clara_intake_ci \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGPORT/clara_intake_ci" \
          node tests/intake-e2e.mjs

    # #633 intake ADMISSION e2e. Reuses the database the step above just built and
    # bootstrapped (same throwaway, same world) because it proves the chain that begins
    # where that one stops: after the bytes are read, nobody calls
    # `clara.request_autodraft`. Seven legs. Leg 1 runs three arms — an UNFILED upload's
    # classify task settling on the estate's own `firm_narrow_consent_inactive` refusal
    # (the control), a CONSENTED and filed document classifying itself to a kind, and a
    # real MyInvois UBL invoice running all the way to `clara.admit_autodraft_task` for
    # its own filing under a sweep run the consumer opened itself. The door's verdict is
    # printed verbatim; it does NOT claim an admitted coding task (this fixture's document
    # is Tier-A-incomplete, a residual named in packages/runtime/README.md). Then: no kind
    # from a failed extraction, duplicate bytes converging on the existing document, a
    # mixed five-file batch settling independently, a replayed finalize staying idempotent,
    # H-53 custody for a non-coding kind, and C-37's real OFX + real XLSX with the levels
    # the registry actually publishes. Standalone (not collected by `node --test`), so it
    # is wired explicitly, exactly like the step above.
    - name: "#633 intake admission e2e (same isolated DB + world)"
      shell: bash -e {0}
      run: |
        cd packages/runtime
        PGDATABASE=clara_intake_ci \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGPORT/clara_intake_ci" \
          node tests/intake-admission-e2e.mjs

    # Wave-B rig-confined fault gates (§4 of the contract): the four STANDALONE runtime e2es
    # (NOT collected by `node --test`, so wired explicitly like intake-e2e above). Gate 3 —
    # interview cancel/kill/complete through the REAL WDK engine (interview-e2e.mjs boots the
    # world in-process; interview-kill-resume-e2e.mjs SPAWNS scripts/serve.mjs so the engine
    # can be SIGKILLed mid-park and respawned on the same DB). Gate 7 — the v25 chatTurn_v6→v7
    # cutover with parked runs + the executable rollback preflight. Own throwaway DB
    # clara_wave_b_ci (matches the guard's *_ci ephemeral pattern) with the WDK world bootstrap
    # (the SAME idempotent `bootstrap` bin the intake-e2e step runs); PGHOST/PGPORT/PGPASSWORD
    # come from the job env. Each e2e owns its lifecycle and exits.
    - name: Wave-B rig-confined fault-gate e2es (Gate 3 + Gate 7 + #623 Work + #637 two-build cutover, isolated DB + world bootstrap)
      shell: bash -e {0}
      run: |
        # 2026-09-02 CI-shape ruling: this step's own PRISTINE cluster (postgres_c/PGC_PORT),
        # never the primary — see the services block's own comment for the why.
        PGPORT=$PGC_PORT PGDATABASE=postgres psql -v ON_ERROR_STOP=1 -c 'create database clara_wave_b_ci'
        PGPORT=$PGC_PORT PGDATABASE=clara_wave_b_ci pnpm db:migrate
        PGPORT=$PGC_PORT PGDATABASE=clara_wave_b_ci pnpm db:seed
        PGPORT=$PGC_PORT \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          pnpm --filter @clara/runtime exec bootstrap
        # #637 — THE TWO-BUILD DRILL'S OWN DATABASE, cut HERE and nowhere else, because this is the
        # only moment clara_wave_b_ci is provably pristine: all 189 migrations, both seeds and the
        # WDK world schemas are on it, and no e2e below has run a single Work against it yet. Every
        # command above has exited, so nothing is connected to the template — which is exactly what
        # CREATE DATABASE ... TEMPLATE requires.
        #
        # A TEMPLATE COPY rather than the intake step's create/migrate/seed/bootstrap idiom, for the
        # reason this action's own header states: migration 0154 pins an ABSOLUTE, cluster-global
        # clara-role count (14) at its position in the chain, and a SECOND from-scratch migrate on
        # this cluster would reach that assertion with the roles the first chain's LATER migrations
        # (0160's clara_stripe_webhook/_login) already minted, and abort. The clone is a file-level
        # copy measured in seconds; migrate+seed+bootstrap measured 139s + 0.8s + ~4s for
        # clara_wave_b_ci on this same cluster in run 34793833626.
        #
        # The NAME is not free. tests/two-build-cutover-e2e.mjs THROWS, and
        # tests/body-census-guard-db.test.mjs SKIPS (and a skip is not evidence), unless PGDATABASE
        # is one of {clara_rt_test, clara_wave_b_ci} — their fail-closed loopback gates — so the
        # drill's own database has to be the OTHER sanctioned throwaway name. clara_rt_test also
        # matches the destructive guard's ephemeral pattern (packages/db/lib/guard.mjs EPHEMERAL_DB,
        # the `*_test` arm), and nothing else under .github/ uses that name.
        PGPORT=$PGC_PORT PGDATABASE=postgres psql -v ON_ERROR_STOP=1 \
          -c 'create database clara_rt_test template clara_wave_b_ci'
        cd packages/runtime
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/interview-e2e.mjs
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/interview-kill-resume-e2e.mjs
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/version-cutover-e2e.mjs
        # #623 — the accounting-Work e2e. STANDALONE like its three siblings above (NOT collected
        # by `node --test`), and wired HERE for the same reason: it needs a real Postgres World, a
        # built server it can SPAWN and KILL, and the ability to crash the engine between a
        # database commit and a workflow checkpoint. It shares the same throwaway
        # clara_wave_b_ci database and the same world bootstrap, and it SKIPS CLEANLY (exit 0,
        # with a printed reason) when migration 0178 is not on that database — so this step is
        # safe to merge before the DB half lands and turns green by itself when it does.
        # RELAY_TEST_MODE=1 is what makes CLARA_WORK_TEST_FAULT honoured at all; the fault is
        # inert in any process without it.
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        RELAY_TEST_MODE=1 \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/work-journal-e2e.mjs
        # #629 — the shared-work-question e2e, AFTER its #623 sibling and on the same rig. It asks
        # a typed question, answers it through the first-answer gate, and drives three durable
        # windows the unit cells cannot: a crash between the LEASE and the RESUME, a crash after
        # the post-answer commit, and TWO worker processes racing one expired lease. It SKIPS
        # CLEANLY (exit 0, printed reason) when migration 0180 is absent, so it is safe to merge
        # before the DB half lands. It spawns its own ephemeral ports rather than reusing this
        # step's, so it can hold two engines up at once without colliding with anything above.
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        RELAY_TEST_MODE=1 \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/work-question-e2e.mjs
        # #630 — the work-CANCELLATION e2e, AFTER its two siblings and on the same rig. It drives
        # the ordering boundary in the only place it is real: a cancel that arrives while a posting
        # transaction holds the Work row lock WAITS and then reports `already_completed`, a cancel
        # that lands first makes the Work read `stopping` and admits no further operation, a
        # revocation between the chart read and the write refuses the commit and leaves the revoked
        # actor unable to read the firm's own rows, and a colleague takes responsibility and posts
        # exactly one entry. It holds the scripted model in a deterministic window through a gate
        # FILE rather than a new CLARA_WORK_TEST_FAULT, because claraWork_v2 is deploy-locked and a
        # test affordance must not mint a new frozen version. It SKIPS CLEANLY (exit 0, printed
        # reason) when migration 0184 is absent, so it is safe to merge before the DB half lands.
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        RELAY_TEST_MODE=1 \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/work-cancel-e2e.mjs
        # WAVE-2 INTEGRATION ORDER — five steps, unchanged: #643, then #637's two-build cutover,
        # then #640, then #637's world guard LAST. What changed is WHY it holds. Ordering used to
        # BE the isolation argument for the drill ("placed after work-cancel-e2e, which settles its
        # own Works, so the inventory is clean by the time this runs"), and run 34793833626
        # disproved it: every e2e above passed on clara_wave_b_ci and the drill still printed
        # `TWO-BUILD CUTOVER E2E: REFUSING TO START — this database already carries live state a
        # two-build drill cannot tell from its own: 1 non-terminal run(s) of claraWork_v2` and
        # exited 1. A drill that cannot tell another leg's parked run from its own must not share a
        # database with legs that park runs, so BOTH #637 steps now run on clara_rt_test (cut
        # above) and this order is no longer load-bearing for them. #643 and #640 keep it on their
        # own terms: both ADMIT AND SETTLE Work on this rig and each leaves no live Work behind.
        # #637's world guard stays LAST because it deliberately stages a run of a body no image
        # exports, which is precisely the condition every step above refuses to start against.
        # #643 — the PERIODIC-ADJUSTMENT e2e, AFTER its three siblings and on the same rig. It
        # drives the one window the unit and DB cells cannot: a run that COMMITS three rows in one
        # transaction (the marked entry, the operation receipt and the clara.periodic_adjustments
        # row) and then dies before the workflow checkpoint, so the respawned engine re-executes
        # the step and must replay onto the SAME identity rather than write a second adjustment. It
        # also proves the two halves nothing else can: that a periodic-adjustment Work runs through
        # the UNCHANGED frozen clara-work/v2 bundle (the typed particulars ride a column the run
        # never reads), and that a sealed fiscal year is a typed 400 at the HTTP boundary instead of
        # a bare 500. It SKIPS CLEANLY (exit 0, printed reason) when migration 0194 is absent, so it
        # is safe to merge before the DB half lands.
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        RELAY_TEST_MODE=1 \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/periodic-adjustment-e2e.mjs
        # #639 — the FIXED-ASSET ACQUISITION e2e, immediately after #643's and on the same rig. It
        # drives the one window nothing else can: migration 0201's acquisition birth is a DEFERRED
        # constraint trigger, so the register row is written at COMMIT inside the posting
        # transaction — and only a real engine that DIES between that commit and the workflow
        # checkpoint can show the row was truly part of it. Four more halves ride with it: an
        # acquisition posted through `/api/work/journal` against an ENROLLED fixed-asset cost
        # account now commits at all (before 0201 the belt refused it at COMMIT with CLR40
        # `fa_belt_unregistered_movement`); the acquisition is complete while the depreciation
        # particulars are still absent; a re-POSTed intentKey births no second asset; and
        # `clara.complete_fixed_asset_particulars_for` re-reads LIVE authority, refusing a demoted
        # initiator by name and writing no journal when it succeeds. It settles its own Work and
        # leaves no live run behind, so the two builds and the world guard still come last. It
        # SKIPS CLEANLY (exit 0, printed reason) when migration 0201 is absent.
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        RELAY_TEST_MODE=1 \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/fixed-asset-acquisition-e2e.mjs
        # #638 — the STAFF-EXPENSE-CLAIM e2e, immediately after its closest sibling and on the same
        # rig, for the same reasons: it admits and settles its own Work and leaves none live. It
        # drives the windows the unit and DB cells cannot. A claim Work runs through the UNCHANGED
        # frozen clara-work/v3 bundle with the purpose vocabulary UNWIDENED (a staff expense claim
        # is a `journal_entry` Work; the typed claim lives in a relation the run never reads), its
        # claim row is durable at ADMISSION rather than at posting, and the crash leg kills the
        # engine between the database commit and the workflow checkpoint on the ADVANCE arm — where
        # the allocation is minted by a DEFERRED constraint trigger at commit, so only a real World
        # can show that the entry, the receipt, the claim and the allocation are one transaction
        # that survives the window. It also proves a replay under REVOKED authority is refused
        # rather than answered `replayed:true`. It SKIPS CLEANLY (exit 0, printed reason) when
        # migration 0206 is absent, so it is safe to merge before the DB half lands.
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        RELAY_TEST_MODE=1 \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/staff-expense-claim-e2e.mjs
        # #631 — the WORK-EGRESS e2e, BEFORE the two builds below, because it is the only leg whose
        # subject is what happens BEFORE a model is called. It drives the three windows nothing
        # else reaches: an authorised run leaves a complete `dispatch -> model_call -> tool_call ->
        # settle` trace on one run id with its authorisation consumed exactly once; a withdrawal
        # taken through `clara.revoke_client_egress_purpose` refuses the NEXT run at the prepare,
        # so no model is called at all and a Retry refuses identically without naming a provider;
        # and the world-e2e leak probe, widened to `clara.work_execution_traces`, finds none of the
        # NRIC / bank account / email / phone / JWT / api-key / DSN literals the admitted basis
        # carries. It SKIPS CLEANLY (exit 0, printed reason) when migration 0195 is absent, so it
        # is safe to merge before the DB half lands. It runs on the SHARED clara_wave_b_ci and leaves it
        # clean, so the two-build drill (its own pristine clara_rt_test) and the world guard still
        # come last.
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        RELAY_TEST_MODE=1 \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/work-egress-e2e.mjs
        # chatTurn_v19 (#643 + #644's shared successor) — the CHAT lane, after every Work-lane leg
        # above (#631's egress leg included) and still before the two builds and the world guard. It drives the one path no unit cell can reach: a
        # real HTTP chat session, a real HTTP turn, the FROZEN chatTurn_v19 body, its two new frozen
        # tools, and then the reconciler's accounting_work arm — which is the only thing that can
        # dispatch a chat-admitted Work, because a frozen file may not import the registry to call
        # `start()`. Four legs: the periodic-adjustment Work admitted from conversation and run to a
        # posted entry; that run served by the UNCHANGED clara-work/v2 bundle with the typed
        # particulars never reaching its prompt (measured inside the model, not asserted about it);
        # one governed knowledge record readable through the HUMAN door `clara.list_client_knowledge`;
        # and both cards durable in `clara.chat_messages.parts`. It settles its own Work, so the
        # inventory is clean for the guard below. It SKIPS CLEANLY (exit 0, printed reason) when
        # migration 0194 or 0192 is absent.
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        RELAY_TEST_MODE=1 \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/chat-turn-v19-e2e.mjs
        # #637 — the TWO-BUILD cutover e2e, LAST on this rig because it is the only step here that
        # BUILDS A SECOND IMAGE. It copies the runtime package to <repo>/.scratch/two-build/previous,
        # rewrites that copy's registry to pin the PREDECESSOR claraWork body, deletes the successor
        # body file, and runs `nitro build` there — then spawns that image, admits Work to it, stops
        # it, spawns THIS tree's build, admits Work to the successor, and resumes the first Work on
        # its original body inside the second image. That is the one thing the single-process
        # version-cutover-e2e above cannot show.
        #
        # MEASURED COST before wiring it (the orchestrator's condition): 78.0s for the scratch build
        # and 124s for the whole file — Windows-host measurements, re-measured at the #637 fix-round
        # closure review (superseding this comment's earlier 82.6s / 3m25s), against a ~6 minute
        # budget. The copy MUST live outside packages/runtime — measured during the spike, a copy at
        # packages/runtime/.scratch made the MAIN nitro build compile 98 workflows instead of 49.
        # Its DATABASE costs the template copy above — a file-level clone, seconds — and not the
        # ~2m20s a from-scratch migrate+seed+bootstrap measures on this runner.
        #
        # It REFUSES TO START (exit 1, named reason) if THIS database already carries live
        # accounting-Work state, and it SKIPS CLEANLY (exit 0, printed reason) when migration 0180 is
        # absent. So it runs on clara_rt_test — its OWN pristine copy, cut above before any sibling
        # e2e had touched the rig — and never on the shared clara_wave_b_ci, whose parked
        # claraWork_v2 run is what failed this step in run 34793833626. It cleans up after itself on
        # every exit path (its own tasks cancelled, its own runs marked cancelled), which is what
        # lets the world guard below reuse the same database.
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_rt_test \
        RELAY_TEST_MODE=1 \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_rt_test" \
          node tests/two-build-cutover-e2e.mjs
        # #640 — the accounting-PLAN occurrence e2e, AFTER its three siblings and on the same rig.
        # It drives the two things only a real world can show about a scheduled occurrence: two
        # belt passes issued CONCURRENTLY on two clara_runtime connections leave exactly one
        # occurrence and one Work (the plan row lock plus `unique (plan_id, due_date)`, measured
        # through the real belt), and a plan-admitted Work — which has no post-commit enqueue at
        # all, because the admission happens inside a database function — is dispatched by the
        # reconciler's accounting_work arm, crashed by CLARA_WORK_TEST_FAULT=exit_after_commit
        # between the commit and the checkpoint, and replayed onto the same logical identity, so
        # the estate ends with one entry, one receipt and one occurrence. It SKIPS CLEANLY
        # (exit 0, printed reason) when migration 0193 is absent, so it is safe to merge before
        # the DB half lands.
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        RELAY_TEST_MODE=1 \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/plan-occurrence-e2e.mjs
        # #652 — the ACCRUAL e2e, immediately after the plan leg it extends and on the same rig.
        # It drives the four things only a real world can show about an evidenced accrual:
        # configuring one writes plan + revision + accrual record + occurrence + Work in ONE commit
        # with no engine running and NOTHING posted (a configuration receipt is not an executed
        # occurrence); a crash between the posting commit and its checkpoint replays onto the same
        # logical identity and still leaves ONE accrual record; the reversal waits for the accrual's
        # committed entry, names it and posts; and a cancel followed by the human's explicitly
        # scoped catch-up produces a re-attempt under the SAME occurrence identity with one accrual
        # record throughout (C88.13's trigger / one effect / retry / cancellation). It SKIPS CLEANLY
        # (exit 0, printed reason) when migration 0207 is absent, so it is safe to merge before the
        # DB half lands.
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        RELAY_TEST_MODE=1 \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/accrual-e2e.mjs
        # #653 — the PREPAYMENT-AMORTISATION occurrence e2e, immediately after its #640 sibling and
        # on the same rig. It adds ONE fact that lane cannot show: a per-period amount survives the
        # frozen `.strict()` tool schema, the run's faithful echo and the digest comparison, so the
        # FINAL period's entry charges the residual (50,001 of 100,001 over two months) rather than
        # the revision's stored constant. Alongside it: two concurrent belt passes leave one
        # occurrence and one Work, the exit_after_commit crash replays onto one entry / one receipt
        # / one occurrence, a third pass admits nothing, and the explicit catch-up admits the
        # earlier period carrying its own base. It SKIPS CLEANLY (exit 0, printed reason) when
        # migration 0208 is absent, so it is safe to merge before the DB half lands.
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_wave_b_ci \
        RELAY_TEST_MODE=1 \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_wave_b_ci" \
          node tests/prepayment-occurrence-e2e.mjs
        # #637 review S5 — the WORLD GUARD, HERE rather than in the unit suite, and the reason is a
        # false-green one: tests/body-census-guard-db.test.mjs SPAWNS the built image against a real
        # Postgres World, so in db-estate-suite (PGDATABASE=clara_ci, no `.output`) its own hard gate
        # SKIPS it — and a skip is not evidence. This job has both the build and the world, so it is
        # where the cells actually run. LAST, and on the DRILL'S database rather than the shared
        # one, for two reasons that point the same way: it stages a run of a body no image exports —
        # precisely the condition every step above refuses to start against — so it must be the last
        # thing to touch whatever database it runs on; and its third cell is a CONTROL that asserts
        # `stranded bodies n=0` and a 200 from /ready on a clean estate, which is the one assertion
        # the shared clara_wave_b_ci cannot be trusted to satisfy. The drill retires everything it
        # parks (its own `finally` cancels its tasks and runs; the closure review measured the rig
        # left clean), so clara_rt_test reaches this line clean. It cancels and deletes its own row
        # on every exit path.
        PGPORT=$PGC_PORT \
        PGDATABASE=clara_rt_test \
        RELAY_TEST_MODE=1 \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGC_PORT/clara_rt_test" \
          node --test tests/body-census-guard-db.test.mjs

    - name: DR backup/restore self-test (ephemeral postgres:17)
      shell: bash -e {0}
      run: pnpm --filter @clara/db dr:selftest

    # FULL-PROFILE DR ROUND-TRIP (hardening interlude): prove the full-fidelity
    # backup -> restore -> verify sequence end-to-end ACROSS TWO CLUSTERS. drci_source
    # lives on the primary service (5432): migrate + seed + the WDK world bootstrap (the
    # SAME idempotent `bootstrap` bin the intake-e2e step runs — it creates workflow /
    # workflow_drizzle / graphile_worker). The FULL profile backup captures all four
    # schemas WITH owners + the GRANT/REVOKE/RLS matrix. The target drci_target is on the
    # SEPARATE postgres_b cluster (5433) whose pg_authid starts EMPTY, so
    # deploy/roles-bootstrap.sql GENUINELY creates the clara roles + memberships (Codex
    # HIGH-5 — not a same-cluster tautology). restore-full runs roles-bootstrap + the
    # single-transaction restore; dr-verify diffs source(5432)<->target(5433) across every
    # fidelity category and REFUSES a self-comparison. Both clusters are PG17 so no
    # cross-version dump GUC issue arises. Canary + AP auto-SKIP (no live data). Any
    # battery FAIL fails CI. Additive. pg_dump/psql are v17; the localhost targets are
    # ephemeral so CLARA_ALLOW_DESTRUCTIVE=1 (job env) authorizes them. PGPASSWORD (job
    # env) is the fallback password for BOTH services (same POSTGRES_PASSWORD).
    - name: DR full-profile round-trip (two clusters, backup->restore->verify)
      shell: bash -e {0}
      run: |
        # SOURCE on its own PRISTINE cluster (postgres_d/PGD_PORT, 2026-09-02 CI-shape ruling)
        # — NOT the primary "postgres" cluster intake_ci already ran a full chain on: 0154's
        # immutable absolute clara-role-count tail assertion cannot distinguish "this cluster's
        # own later migrations" from "a role a DIFFERENT database's earlier completed chain on
        # this SAME cluster already minted", so a from-scratch migrate here must never share a
        # cluster with another from-scratch migrate. See the services block's own comment.
        PGPORT=$PGD_PORT PGDATABASE=postgres psql -v ON_ERROR_STOP=1 -c 'create database drci_source'
        PGPORT=$PGD_PORT PGDATABASE=drci_source pnpm db:migrate
        PGPORT=$PGD_PORT PGDATABASE=drci_source pnpm db:seed
        # roles-bootstrap the SOURCE too: the migrations create only the clara group/login
        # roles (9 through 0009, + clara_wake_bank/_login from 0121, + clara_wake_filing from
        # 0126, + clara_stripe_webhook/_login from 0160) — clara_storage_docs comes from
        # storage-provision.sql / roles-bootstrap, NOT a migration. Running it here gives the
        # SOURCE cluster the SAME role census the TARGET cluster gets, so role/membership
        # parity is genuine and not a deterministic clara_storage_docs mismatch (Codex
        # re-verify NEW HIGH-2). All shells are NOLOGIN on a fresh migrate, so the
        # fresh-target-only preflight cannot abort here.
        PGPORT=$PGD_PORT PGDATABASE=drci_source psql -v ON_ERROR_STOP=1 -f packages/db/deploy/roles-bootstrap.sql
        PGPORT=$PGD_PORT \
        WORKFLOW_POSTGRES_URL="postgres://postgres@localhost:$PGD_PORT/drci_source" \
          pnpm --filter @clara/runtime exec bootstrap
        PGPORT=$PGD_PORT PGDATABASE=drci_source node packages/db/scripts/backup.mjs --profile full --out $RUNNER_TEMP/drci-full.sql
        # TARGET on cluster B (5433) — a fresh cluster with an EMPTY pg_authid, dedicated to
        # this restore ONLY (never a from-scratch migrate target — see the services comment)
        PGPORT=$PGB_PORT PGDATABASE=postgres psql -v ON_ERROR_STOP=1 -c 'create database drci_target'
        PGPORT=$PGB_PORT PGDATABASE=drci_target psql -v ON_ERROR_STOP=1 -f packages/db/deploy/roles-bootstrap.sql
        PGPORT=$PGB_PORT PGDATABASE=drci_target node packages/db/scripts/restore-full.mjs --file $RUNNER_TEMP/drci-full.sql
        CLARA_DR_SOURCE_URL="postgres://postgres@localhost:$PGD_PORT/drci_source" \
        CLARA_DR_TARGET_URL="postgres://postgres@localhost:$PGB_PORT/drci_target" \
          node packages/db/scripts/dr-verify.mjs
